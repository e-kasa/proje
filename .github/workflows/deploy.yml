name: Deploy

on:
  # Her servis reposundan gelen dispatch tetiklemesi
  repository_dispatch:
    types: [service-updated]
  # Manuel tetikleme (GitHub Actions UI'dan)
  workflow_dispatch:
    inputs:
      service:
        description: 'Hangi servis güncellendi?'
        required: false
        default: 'all'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Flutter web artifact varsa indir (flutter-web servisi güncellendiğinde)
      - name: Download flutter-web artifact (varsa)
        if: github.event.client_payload.service == 'flutter-web' || github.event_name == 'workflow_dispatch'
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          repo: ${{ github.repository_owner }}/sedcore-pos-app
          workflow: ci.yml
          name: flutter-web
          path: ./deploy-artifacts/flutter-web
        continue-on-error: true

      # APK + Windows indirilebilir dosyalar
      - name: Download APK artifact (varsa)
        if: github.event.client_payload.service == 'flutter-web' || github.event_name == 'workflow_dispatch'
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          repo: ${{ github.repository_owner }}/sedcore-pos-app
          workflow: ci.yml
          name: flutter-apk
          path: ./deploy-artifacts/downloads
        continue-on-error: true

      - name: Download Windows artifact (varsa)
        if: github.event.client_payload.service == 'flutter-web' || github.event_name == 'workflow_dispatch'
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          repo: ${{ github.repository_owner }}/sedcore-pos-app
          workflow: ci.yml
          name: flutter-windows
          path: ./deploy-artifacts/downloads
        continue-on-error: true

      # Statik dosyaları sunucuya kopyala (sadece flutter-web güncellendiğinde)
      - name: Copy Flutter web to server
        if: github.event.client_payload.service == 'flutter-web'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "deploy-artifacts/flutter-web/"
          target: "/opt/sedcore-pos/static/flutter-web/"
          strip_components: 2

      - name: Copy downloads to server
        if: github.event.client_payload.service == 'flutter-web'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "deploy-artifacts/downloads/"
          target: "/opt/sedcore-pos/static/downloads/"
          strip_components: 2

      # Docker image'ları pull et ve servisleri başlat
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /opt/sedcore-pos
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose pull
            docker compose up -d --remove-orphans
            sleep 20
            bash scripts/healthcheck.sh
