server {
    listen 80;
    server_name _;

    client_max_body_size 20M;

    # Flutter Web SPA
    location / {
        root /usr/share/nginx/html/flutter;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # React Dashboard
    location /dashboard/ {
        alias /usr/share/nginx/html/template/;
        index index.html;
        try_files $uri $uri/ /dashboard/index.html;
    }

    # API traffic → api-manager (Spring Cloud Gateway)
    location /security/ {
        proxy_pass http://api-manager:8080/security/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    location /product/ {
        proxy_pass http://api-manager:8080/product/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # İndirilebilir dosyalar (APK, Windows installer)
    location /download/ {
        alias /usr/share/nginx/html/downloads/;
        autoindex on;
        add_header Content-Disposition 'attachment';
    }

    # Grafana (sub-path)
    location /grafana/ {
        proxy_pass http://grafana:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
