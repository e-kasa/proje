spring.application.name=pos-product-manager

# ====================================================================
# JAVA 25 — VIRTUAL THREADS (Project Loom)
# ====================================================================
# Tüm request thread'leri ve @Async işleri sanal thread kullanır
spring.threads.virtual.enabled=true
server.servlet.context-path=/product

server.port=8001

spring.datasource.url=jdbc:postgresql://localhost:5432/ekalem
spring.datasource.username=ekalem
spring.datasource.password=ekalem
spring.datasource.driver-class-name=org.postgresql.Driver


spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
spring.jpa.generate-ddl=true
# Seed data: spring.sql.init.mode=always + defer=true → data.sql her başlatmada çalışır
# İlk kurulumda: ddl-auto=create yapıp tekrar update'e çevir
# Veya flyway/liquibase migration'a geç
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# ====================================================================
# ACTUATOR & PROMETHEUS CONFIGURATION
# ====================================================================

# Enable all actuator endpoints for monitoring
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoints.web.base-path=/actuator

# Enable Prometheus metrics registry
management.metrics.enable.jvm=true
management.metrics.enable.process=true
management.metrics.enable.system=true

# Prometheus metrics endpoint
management.endpoints.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true

# Health endpoint configuration
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always

# Info endpoint shows app metadata
info.app.name=POS Product Manager Service
info.app.version=1.0.0
info.app.description=RESTful API for POS product management with hybrid recommendations
info.company=SEDCORE
info.contact.email=support@sedcore.com

# ====================================================================
# OCR SERVICE (Python — port 8003)
# ====================================================================
ocr.service.url=http://localhost:8003

# ====================================================================
# SCHEDULED RECONCILE (Sprint 3 — P1.1)
# ====================================================================
# Plan: ilk hafta cron.paused=true + manuel gün; prod'da true yap.
reconcile.scheduled.enabled=false
# Varsayılan: her gece 03:00 (saniye dakika saat DoM ay DoW)
reconcile.scheduled.cron=0 0 3 * * *

# Slack webhook — boşsa notifier no-op (sadece log).
# Prod: https://hooks.slack.com/services/XXX/YYY/ZZZ
slack.webhook.url=

# ====================================================================
# EMAIL (Sprint 5 mini — statement PDF gönderimi)
# ====================================================================
# mail.enabled=false → EmailService no-op (endpoint 200 döner ama sent=false)
# Prod'da true yap ve spring.mail.* yapılandır. Şifre env var: SPRING_MAIL_PASSWORD
mail.enabled=false
mail.from=noreply@sedcore.com
# spring.mail.host=smtp.example.com
# spring.mail.port=587
# spring.mail.username=apikey
# spring.mail.password=${SPRING_MAIL_PASSWORD:}
# spring.mail.properties.mail.smtp.auth=true
# spring.mail.properties.mail.smtp.starttls.enable=true

# ====================================================================
# NOTIFICATIONS (Sprint 25 — backend foundation)
# ====================================================================
# Channel-aware bildirim sistemi:
#  - EMAIL kanalı Sprint 25: yukarıdaki SMTP üzerinden (mail.enabled bağlı)
#  - SMS kanalı Sprint 26+ (Twilio, notification.sms.provider=twilio)
#  - WHATSAPP/PUSH Sprint 27-28
#
# @Async deliver loop: in-memory retry. Sprint 26'da RabbitMQ'a refactor.
# Çoklu instance için RabbitMQ ZORUNLU (Sprint 25 tek-instance senaryosu).
notification.async.thread-pool.size=5
notification.async.queue-capacity=100
notification.retry.max-attempts=3
notification.retry.initial-delay-ms=5000
notification.retry.multiplier=2.0

# Sprint 26-A — SMS provider abstraction
# noop      : default (gerçek SMS yok, log'a yazar) — credentials yokken
# twilio    : Twilio SDK (notification.twilio.* doldurulmalı)
# netgsm    : Sprint 27 — Türkiye yerel
# iletimerkezi : Sprint 27+ — Türkiye toplu
notification.sms.provider=noop
# Twilio aktive etmek için: notification.sms.provider=twilio + aşağıdaki 3 değeri doldur
notification.twilio.account-sid=${TWILIO_ACCOUNT_SID:}
notification.twilio.auth-token=${TWILIO_AUTH_TOKEN:}
notification.twilio.from-phone=${TWILIO_PHONE_NUMBER:}