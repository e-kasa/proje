# POS System Error Messages - Turkish & English
# Format: code.key = TR: Turkish Message | EN: English Message

# Validation Errors (1000-1099)
1001.message = TR: Gerekli alan boş | EN: Required field is empty
1002.message = TR: Değer minimum ve maksimum arasında olmalı | EN: Value must be between minimum and maximum
1003.message = TR: Değer maksimumdan daha büyük olamaz | EN: Value cannot be larger than maximum
1004.message = TR: Bu kayıt zaten sistem'de mevcut | EN: This record already exists in the system
1006.message = TR: Aradığınız kayıt bulunamadı | EN: The requested record was not found
1007.message = TR: Kullanılan öğe silinemez | EN: Used item cannot be deleted
1008.message = TR: Sistem'de mevcut değil | EN: Does not exist in the system
1012.message = TR: Bu işlem için yetkiniz yok | EN: You do not have authorization for this operation
1032.message = TR: Minimum boyut koşulu karşılanmadı | EN: Minimum size validation failed
1033.message = TR: Maksimum boyut koşulu karşılanmadı | EN: Maximum size validation failed
1046.message = TR: Girilen veri formatı uygun değil | EN: Entered data format is not suitable
1051.message = TR: Veri biçimi uygun değil | EN: Data format is not suitable
1083.message = TR: Bu alanı değiştiremezsiniz | EN: You cannot change this field

# Business Logic Errors (1100-1200)
1118.message = TR: İptal edilen notu güncelleyemezsiniz | EN: Cannot update cancelled notes
1142.message = TR: Kapsamların toplam yüzdesi %100 olmalı | EN: Total coverage percentage must be 100%
1167.message = TR: Tahsilat tutarı boş olamaz | EN: Collection amount cannot be empty
1168.message = TR: Ödeme tutarı boş olamaz | EN: Payment amount cannot be empty
1201.message = TR: Doğrulama hatası | EN: Validation error

# Stock & Inventory Errors (Custom for POS)
1300.message = TR: Yetersiz stok | EN: Insufficient inventory
1301.message = TR: Ürün bulunamadı | EN: Product not found
1302.message = TR: Depo bulunamadı | EN: Warehouse not found
1303.message = TR: Stok hareketi kaydedilemedi | EN: Stock movement could not be recorded
1304.message = TR: Satış oluşturulamadı | EN: Sale could not be created
1305.message = TR: Satın alma oluşturulamadı | EN: Purchase could not be created
1306.message = TR: Müşteri bulunamadı | EN: Customer not found
1307.message = TR: Tedarikçi bulunamadı | EN: Supplier not found
1308.message = TR: Ödeme kaydedilemedi | EN: Payment could not be recorded
1309.message = TR: Fatura oluşturulamadı | EN: Invoice could not be created

# Authorization & Access Errors
2000.message = TR: Yetkilendirme süreci başlamış | EN: Authorization process has already started
2001.message = TR: Yetkilendirme birinci görev oluşturulamadı | EN: Authorization first task creation failed

# System Errors
9998.message = TR: Aradığınız sonuç bulunamadı | EN: No results found
9999.message = TR: Beklenmeyen bir hata oluştu, lütfen sistem yöneticisine başvurunuz | EN: An unexpected error occurred, please contact your system administrator

# Success Messages
9997.message = TR: İşlem başarıyla tamamlandı | EN: Operation completed successfully
9996.message = TR: Bu özellik geliştirme aşamasındadır | EN: This feature is under development
