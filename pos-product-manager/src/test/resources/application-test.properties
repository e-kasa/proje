# Sprint 7 WP2 — Test ortamı: H2 in-memory (PostgreSQL uyum modu).
#
# data.sql çalıştırılmaz (test'ler kendi fixture'unu kurar).
# ddl-auto=create-drop her test class temiz başlar.

spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# Production'daki seed/init script'lerini test'te koşturma
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=false
