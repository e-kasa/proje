name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - run: flutter pub get
      - run: flutter test
      - name: Build Flutter Web
        run: flutter build web --release --base-href /
      - name: Upload Flutter Web
        uses: actions/upload-artifact@v4
        with:
          name: flutter-web
          path: build/web/
      - name: Build APK
        run: flutter build apk --release
      - name: Build AAB
        run: flutter build appbundle --release
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-aab
          path: build/app/outputs/bundle/release/app-release.aab

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Zip Windows build
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath sedcore-pos-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: flutter-windows
          path: sedcore-pos-windows.zip

  create-release:
    needs: [build-android, build-windows]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: flutter-apk
          path: release-files/
      - uses: actions/download-artifact@v4
        with:
          name: flutter-aab
          path: release-files/
      - uses: actions/download-artifact@v4
        with:
          name: flutter-windows
          path: release-files/
      - run: |
          mv release-files/app-release.apk release-files/sedcore-pos.apk
          mv release-files/app-release.aab release-files/sedcore-pos.aab
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "SEDCORE POS — Build #${{ github.run_number }}"
          body: |
            Otomatik build — commit: ${{ github.sha }}

            **İndir:**
            - `sedcore-pos.apk` → Android
            - `sedcore-pos.aab` → Google Play Store
            - `sedcore-pos-windows.zip` → Windows Desktop
          files: |
            release-files/sedcore-pos.apk
            release-files/sedcore-pos.aab
            release-files/sedcore-pos-windows.zip

  trigger-deploy:
    needs: create-release
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.INFRA_DEPLOY_TOKEN }}
          script: |
            await github.rest.repos.createDispatchEvent({
              owner: context.repo.owner,
              repo: 'sedcore-infrastructure',
              event_type: 'service-updated',
              client_payload: { service: 'flutter-web', sha: context.sha }
            })
