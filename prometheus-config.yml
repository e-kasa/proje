# Prometheus Configuration for POS Microservices
# Docker Compose deployment — targets use Docker service names, not localhost.
# Location: /etc/prometheus/prometheus.yml
# Reload: curl -X POST http://prometheus:9090/-/reload

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'pos-system'
    region: 'production'

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: 'pos-product-manager'
    scrape_interval: 15s
    scrape_timeout: 10s
    metrics_path: '/product/actuator/prometheus'
    static_configs:
      - targets: ['pos-product-manager:8001']
        labels:
          service: 'product-manager'

  - job_name: 'api-manager'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['api-manager:8080']
        labels:
          service: 'api-gateway'

  - job_name: 'config-server'
    metrics_path: '/config-server/actuator/prometheus'
    static_configs:
      - targets: ['config-server:8081']
        labels:
          service: 'config-server'

  - job_name: 'security-service'
    metrics_path: '/security/actuator/prometheus'
    static_configs:
      - targets: ['security:8002']
        labels:
          service: 'security'

