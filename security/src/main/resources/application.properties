server.servlet.context-path=/security
server.port=8002

spring.datasource.url=jdbc:postgresql://localhost:5432/ekalem
spring.datasource.username=ekalem
spring.datasource.password=ekalem
spring.datasource.driver-class-name=org.postgresql.Driver


spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.generate-ddl=true
# Run data.sql after Hibernate creates schema (required for seed data on startup)
spring.jpa.defer-datasource-initialization=true
# Optional: enable SQL init; data.sql runs by default when defer-datasource-initialization=true
spring.sql.init.mode=always