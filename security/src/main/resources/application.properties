# ====================================================================
# JAVA 25 — VIRTUAL THREADS (Project Loom)
# ====================================================================
spring.threads.virtual.enabled=true

server.servlet.context-path=/security
server.port=8002

spring.datasource.url=jdbc:postgresql://localhost:5432/ekalem
spring.datasource.username=ekalem
spring.datasource.password=ekalem
spring.datasource.driver-class-name=org.postgresql.Driver


spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=create
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
spring.jpa.generate-ddl=true
# Run data.sql after Hibernate creates schema (required for seed data on startup)
spring.jpa.defer-datasource-initialization=true
# Optional: enable SQL init; data.sql runs by default when defer-datasource-initialization=true
spring.sql.init.mode=always